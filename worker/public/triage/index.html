<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page Triage (internal review tool)</title>
<style>
  /* Deliberately plain. This is a working tool, NOT the church website. */
  :root { --line:#d9d9d9; --ink:#1a1a1a; --muted:#666; --bg:#f4f4f4;
          --keep:#1e7d34; --cons:#9a6b00; --remove:#a4262c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.45; }
  .wrap { max-width:860px; margin:0 auto; padding:0 16px 80px; }
  header { background:#fffbe6; border-bottom:2px solid #e0c200; }
  .head-in { max-width:860px; margin:0 auto; padding:14px 16px; }
  h1 { font-size:1.2rem; margin:0 0 2px; }
  .sub { font-size:.8rem; color:var(--muted); margin:0; }
  .bar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
         display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; }
  .bar .grow { flex:1 1 auto; }
  .count { font-size:.85rem; color:var(--muted); }
  .count strong { color:var(--ink); }
  select, button { font:inherit; }
  .btn { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; }
  .btn:hover { background:#f0f0f0; }
  ul { list-style:none; margin:20px 0 0; padding:0; }
  li.card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  li.card.done { border-left:5px solid #bbb; }
  li.card.keep { border-left:5px solid var(--keep); }
  li.card.consolidate { border-left:5px solid var(--cons); }
  li.card.remove { border-left:5px solid var(--remove); }
  .row1 { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .num { color:var(--muted); font-size:.8rem; min-width:28px; }
  .title { font-weight:600; font-size:1.02rem; }
  .badge { font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:4px;
           background:#eee; color:#555; }
  .badge.draft { background:#fde9c8; color:#8a5a00; }
  .badge.private { background:#e6dcff; color:#5b3fa0; }
  .meta { font-size:.78rem; color:var(--muted); margin:4px 0 0; }
  .meta a { color:#1155cc; }
  .meta .nolink { color:#999; font-style:italic; }
  .suggest { font-size:.76rem; color:var(--muted); margin:6px 0 0; }
  .suggest b { color:var(--ink); text-transform:capitalize; }
  .choices { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .choices button { flex:1 1 0; min-width:110px; padding:9px 8px; border-radius:6px; border:2px solid var(--line);
                    background:#fff; cursor:pointer; font-weight:600; }
  .choices button[data-v="keep"].on { background:var(--keep); color:#fff; border-color:var(--keep); }
  .choices button[data-v="consolidate"].on { background:var(--cons); color:#fff; border-color:var(--cons); }
  .choices button[data-v="remove"].on { background:var(--remove); color:#fff; border-color:var(--remove); }
  .choices button:hover { filter:brightness(.97); }
  .note { width:100%; margin-top:10px; font:inherit; font-size:.85rem; padding:6px 8px;
          border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:34px; display:none; }
  li.card .note.show { display:block; }
  .notetoggle { background:none; border:none; color:#1155cc; cursor:pointer; font-size:.76rem; padding:6px 0 0; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <h1>Page Triage &mdash; internal review tool</h1>
    <p class="sub">Not the real website. Go through each page, look at the live version, decide: Keep, Consolidate, or Remove. Your choices save in this browser. Export when done.</p>
  </div>
</header>

<div class="bar">
  <span class="count" id="count"></span>
  <span class="grow"></span>
  <label class="count">Show
    <select id="filter">
      <option value="published">Published only</option>
      <option value="all">All 82</option>
      <option value="undecided">Undecided</option>
    </select>
  </label>
  <button class="btn" id="export">Export CSV</button>
  <button class="btn" id="reset">Reset</button>
</div>

<div class="wrap">
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nothing to show with this filter.</p>
</div>

let decisions = {};
try { decisions = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { decisions = {}; }
function save() { localStorage.setItem(KEY, JSON.stringify(decisions)); }

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const countEl = document.getElementById("count");
const filterEl = document.getElementById("filter");

function liveUrl(p) {
  if (p.status !== "publish") return null;
  if (!p.slug || p.slug === "/") return p.slug === "/" ? LIVE + "/" : null;
  return LIVE + p.slug;
}

function visible() {
  const f = filterEl.value;
  if (f === "all") return PAGES;
  if (f === "undecided") return PAGES.filter(p => !decisions[p.id]);
  return PAGES.filter(p => p.status === "publish");
}

function renderCount() {
  const total = PAGES.length;
  const done = PAGES.filter(p => decisions[p.id] && decisions[p.id].d).length;
  const pubTotal = PAGES.filter(p => p.status === "publish").length;
  const pubDone = PAGES.filter(p => p.status === "publish" && decisions[p.id] && decisions[p.id].d).length;
  countEl.innerHTML = "Published decided: <strong>" + pubDone + " / " + pubTotal +
    "</strong> &nbsp;·&nbsp; All: " + done + " / " + total;
}

function cardClass(p) {
  const d = decisions[p.id] && decisions[p.id].d;
  return "card" + (d ? " " + d : "");
}

function render() {
  const rows = visible();
  listEl.innerHTML = "";
  emptyEl.hidden = rows.length > 0;
  for (const p of rows) {
    const url = liveUrl(p);
    const d = decisions[p.id] || {};
    const li = document.createElement("li");
    li.className = cardClass(p);
    li.dataset.id = p.id;

    const linkHtml = url
      ? '<a href="' + url + '" target="_blank" rel="noopener">View live page ↗</a> <span style="color:#999">' + esc(p.slug) + '</span>'
      : '<span class="nolink">' + esc(p.status) + ', no live URL</span> <span style="color:#bbb">' + esc(p.slug) + '</span>';

    const suggestHtml = p.suggest
      ? '<div class="suggest">Starting suggestion: <b>' + p.suggest + '</b>' + (p.note ? ' &mdash; ' + esc(p.note) : '') + '</div>'
      : '';

    li.innerHTML =
      '<div class="row1"><span class="num">#' + p.num + '</span>' +
        '<span class="title">' + esc(p.title) + '</span>' +
        '<span class="badge ' + p.status + '">' + esc(p.status) + '</span></div>' +
      '<div class="meta">' + linkHtml + ' &nbsp;·&nbsp; ' + p.words + ' words &nbsp;·&nbsp; modified ' + p.modified + '</div>' +
      suggestHtml +
      '<div class="choices">' +
        '<button data-v="keep" class="' + (d.d === "keep" ? "on" : "") + '">Keep</button>' +
        '<button data-v="consolidate" class="' + (d.d === "consolidate" ? "on" : "") + '">Consolidate</button>' +
        '<button data-v="remove" class="' + (d.d === "remove" ? "on" : "") + '">Remove</button>' +
      '</div>' +
      '<button class="notetoggle">' + (d.note ? "Edit note" : "+ Add a note") + '</button>' +
      '<textarea class="note' + (d.note ? " show" : "") + '" placeholder="Optional note (e.g. where it folds into)">' + esc(d.note || "") + '</textarea>';

    listEl.appendChild(li);
  }
  renderCount();
}

listEl.addEventListener("click", (e) => {
  const li = e.target.closest("li.card");
  if (!li) return;
  const id = li.dataset.id;
  if (e.target.matches(".choices button")) {
    const v = e.target.dataset.v;
    const cur = decisions[id] || {};
    cur.d = (cur.d === v) ? "" : v;     // tap again to clear
    decisions[id] = cur;
    save();
    // update just this card + filter behavior
    if (filterEl.value === "undecided" && cur.d) { render(); }
    else {
      li.className = cardClass({ id });
      li.querySelectorAll(".choices button").forEach(b =>
        b.classList.toggle("on", b.dataset.v === cur.d));
      renderCount();
    }
  } else if (e.target.matches(".notetoggle")) {
    li.querySelector(".note").classList.toggle("show");
    li.querySelector(".note").focus();
  }
});

listEl.addEventListener("input", (e) => {
  if (!e.target.matches(".note")) return;
  const li = e.target.closest("li.card");
  const id = li.dataset.id;
  const cur = decisions[id] || {};
  cur.note = e.target.value;
  decisions[id] = cur;
  save();
});

filterEl.addEventListener("change", render);

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Clear ALL your decisions and notes? This cannot be undone.")) {
    decisions = {}; save(); render();
  }
});

document.getElementById("export").addEventListener("click", () => {
  const head = ["num","title","slug","status","suggested","decision","note"];
  const lines = [head.join(",")];
  for (const p of PAGES) {
    const d = decisions[p.id] || {};
    lines.push([p.num, q(p.title), q(p.slug), p.status, p.suggest || "",
                d.d || "", q(d.note || "")].join(","));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "page-triage-decisions.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

function q(s) { s = String(s == null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

render();
</script>
</body>
</html>
