<!-- ============================================================
     ALL SAINTS' — HERO  (Code Block)

     WHERE THIS GOES:  Homepage → add a Section → set it Full Bleed,
     remove the section's top/bottom padding → add ONE Code Block →
     paste all of this.

     DEPENDS ON:
     - custom-css-global.css pasted in Design → Custom CSS (tokens, buttons).
     - footer-injection.html for the random image (this block's <img> is id="hero-image").
     - The section's own animation set to "None" (Site Styles / section panel),
       or the whole 100vh hero fades in on every load.

     IMAGES:  upload the 5 hero images to the Media Library, then update the
     array in footer-injection.html with their CDN URLs. The src below is just
     the initial frame; swap it to one real CDN URL too so there's no flash of 404.

     This block carries its own <style> (the hero layout is homepage-only and
     is NOT in the global stylesheet). Everything else inherits from global.
     ============================================================ -->
<style>
  .as-hero { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .as-hero .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .as-hero .hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: saturate(0.85); }
  .as-hero .hero-overlay { position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(135deg, rgba(123, 35, 50, 0.25) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.6) 100%); }
  .as-hero .hero-overlay-radial { position: absolute; inset: 0; z-index: 1; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(ellipse 55% 60% at 80% 15%, rgba(201, 168, 76, 0.14) 0%, rgba(123, 35, 50, 0.06) 45%, transparent 70%); }
  .as-hero .hero-content { position: relative; z-index: 2; text-align: center; color: #fff; padding: var(--space-24) var(--space-6) var(--space-16); max-width: 800px; }
  .as-hero .hero-label { display: inline-block; font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-gold-light); margin-bottom: var(--space-6); padding: 0.4rem var(--space-4); background: rgba(26, 6, 9, 0.5); border: 1px solid rgba(232, 217, 160, 0.5); border-radius: 2px; }
  .as-hero .hero-heading { font-family: var(--font-display); font-size: var(--display-lg); font-weight: 700; line-height: 1.05; margin-bottom: 1.25rem; text-shadow: 0 2px 40px rgba(0, 0, 0, 0.3); }
  .as-hero .hero-heading em { font-style: italic; color: var(--color-gold-light); }
  .as-hero .hero-sub { font-size: var(--text-md); line-height: 1.6; opacity: 0.9; margin: 0 auto var(--space-3); max-width: 560px; }
  .as-hero .hero-services { display: flex; align-items: center; justify-content: center; gap: var(--space-6); margin: var(--space-6) 0 var(--space-10); flex-wrap: wrap; }
  .as-hero .hero-service-badge { display: flex; align-items: center; gap: var(--space-2); background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); padding: 0.6rem var(--space-5); border-radius: var(--radius-pill); border: 1px solid rgba(255, 255, 255, 0.15); font-size: var(--text-base); font-weight: 500; color: #fff; text-decoration: none; transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; }
  .as-hero .hero-service-badge:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }
  .as-hero .hero-service-badge .time { font-weight: 700; color: var(--color-gold-light); }
  .as-hero .hero-scroll-indicator { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); color: rgba(255, 255, 255, 0.6); font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; animation: asScrollBounce 2s ease-in-out infinite; }
  .as-hero .hero-scroll-indicator svg { width: 20px; height: 20px; stroke: rgba(255, 255, 255, 0.6); }
  @keyframes asScrollBounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }
  @media (max-width: 480px) { .as-hero .hero-services { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { .as-hero .hero-scroll-indicator { animation: none; } }
</style>

<!-- .as-content wrapper: REQUIRED — the global CSS is scoped to it. -->
<div class="as-content">
<section class="as-hero" aria-label="Welcome">
  <div class="hero-bg">
    <img id="hero-image" src="/assets/2026/exterior-2026.jpg" alt="" role="presentation" loading="eager" fetchpriority="high">
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-overlay-radial"></div>
  <div class="hero-content">
    <div class="hero-label">All Saints' Episcopal Church &middot; Concord, NC</div>
    <h1 class="hero-heading">All are <em>welcome</em> in this place</h1>
    <p class="hero-sub">As the Episcopal branch of the Jesus Movement, and followers of Jesus' Way, we seek to live like him.</p>
    <div class="hero-services">
      <a class="hero-service-badge" href="#worship" aria-label="9:00 AM Family service, see worship details">
        <span class="time">9:00 AM</span><span>Family</span>
      </a>
      <a class="hero-service-badge" href="#worship" aria-label="11:10 AM Traditional service, see worship details">
        <span class="time">11:10 AM</span><span>Traditional</span>
      </a>
    </div>
    <div class="hero-ctas">
      <a href="/visit" class="btn btn-primary">Join Us Sunday</a>
      <a href="/watch-and-listen" class="btn btn-outline" aria-label="Watch Live on YouTube">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.498 6.186a2.998 2.998 0 0 0-2.108-2.118C19.62 3.5 12 3.5 12 3.5s-7.62 0-9.39.568A2.998 2.998 0 0 0 .502 6.186 31.27 31.27 0 0 0 0 12a31.27 31.27 0 0 0 .502 5.814 2.998 2.998 0 0 0 2.108 2.118C4.38 20.5 12 20.5 12 20.5s7.62 0 9.39-.568a2.998 2.998 0 0 0 2.108-2.118A31.27 31.27 0 0 0 24 12a31.27 31.27 0 0 0-.502-5.814zM9.75 15.568V8.432L15.818 12 9.75 15.568z"/></svg>
        Watch Live
      </a>
    </div>
  </div>
  <div class="hero-scroll-indicator" aria-hidden="true">
    <span>Explore</span>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
  </div>
</section>
</div><!-- /.as-content -->
