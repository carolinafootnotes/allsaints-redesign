<!-- ============================================================
     ALL SAINTS' — FONTS  (head injection)

     WHERE THIS GOES:  Squarespace → Settings → Advanced →
     Code Injection → HEADER.  Paste this whole block.

     WHY:  DM Sans is in Squarespace's native font picker, but
     Cormorant Garamond (the display serif) is NOT. This loads both
     from Google Fonts so the tokens in custom-css-global.css resolve.

     After this loads, you can set headings → Cormorant Garamond and
     body → DM Sans in Site Styles, OR rely on the CSS var() tokens.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
